    <title>HelgeSound | Electronic Live Act</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="./static/live-act-game.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body class="bg-zinc-900 text-white">

    <nav x-data="{ open: false }" class="fixed w-full z-50 bg-zinc-900/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="#home" class="text-xl tracking-tighter hover:text-indigo-400 transition-colors">
                        Helge - Live Electronics
                    </a>
                </div>

                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">

                        <a href="#home" class="hover:text-indigo-400 px-3 py-2 transition-colors">Home</a>
                        <a href="#about" class="hover:text-indigo-400 px-3 py-2 transition-colors">About</a>
                        -->
                        <a href="https://www.instagram.com/helge.techno/" class="hover:text-white transition-transform hover:scale-110 duration-300">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="https://www.youtube.com/@helge.techno" class="hover:text-white transition-transform hover:scale-110 duration-300">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                        <a href="https://soundcloud.com/helge_techno" class="hover:text-white transition-transform hover:scale-110 duration-300">
                            <i class="fa-brands fa-soundcloud"></i>
                        </a>
                        <a href="mailto:hi@helgesound.de" class="hover:text-white transition-transform hover:scale-110 duration-300">
                            <i class="fa-solid fa-envelope"></i>
                        </a>
                    </div>
                </div>

                <!--
                <div class="md:hidden flex items-center">
                    <button @click="open = !open" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-zinc-800 focus:outline-none">
                        <svg class="h-6 w-6" :class="{'hidden': open, 'block': !open }" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg class="h-6 w-6" :class="{'block': open, 'hidden': !open }" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                        </svg>
                    </button>
                </div>
                -->
            </div>
        </div>

        <div x-show="open"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             class="md:hidden bg-zinc-900 border-b border-white/10">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="#home" @click="open = false" class="block px-3 py-2 rounded-md hover:bg-zinc-800">Home</a>
                <a href="#loops" @click="open = false" class="block px-3 py-2 rounded-md hover:bg-zinc-800">Loops</a>
            </div>
        </div>
    </nav>

    <!-- Added top padding (pt-24) to account for the fixed navbar -->
    <main class="pt-24 pb-16 min-h-screen flex flex-col justify-center">

        <!-- Video Container -->
        <section class="w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(99,102,241,0.15)] border border-white/10 bg-black transition-transform duration-500 hover:scale-[1.01]">
                <iframe
                    class="absolute top-0 left-0 w-full h-full"
                    src="https://www.youtube.com/embed/mPBdemBxYdo?si=PkiqAkAzstnR8zwb"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

    </main>

    <footer class="bg-zinc-900 text-zinc-400 py-12 px-6 lg:px-8 border-t border-white/5">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center">

            <div class="w-full py-10 border-b border-white/5">

                    <a href="https://www.instagram.com/helge.techno/" class="hover:text-white transition-transform hover:scale-110 duration-300">
                        <i class="fa-brands fa-instagram"></i>

                    </a>
                </div>
            </div>

            <div class="w-full pt-10 space-y-6">
                <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 uppercase tracking-widest text-[10px]">
                    <a href="./impressum.html" class="hover:text-white">Impressum</a>
                    <a href="./datenschutz.html" class="hover:text-white">Datenschutz</a>
                </div>
            </div>
            <div class="w-full pt-10 space-y-6">
                <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 uppercase tracking-widest text-[10px]">
                    <span class="text-zinc-600">© 2026 HelgeSound</span>
